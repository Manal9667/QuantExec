# One-command local stack:  docker compose up --build
#   backend  -> http://localhost:8000  (API docs at /docs)
#   frontend -> http://localhost:5173
#
# Both Dockerfiles expect the repo root as the build context (they COPY
# paths like `backend/` and `frontend/`), hence `context: .`.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite experiment database across container restarts.
      - ./experiments:/app/experiments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
